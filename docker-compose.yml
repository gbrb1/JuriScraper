services:
  db:
    image: postgres:15-alpine
    container_name: postgres_scraper
    environment:
      POSTGRES_DB: ScraperJuridicoDb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ScraperJuridicoDb"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: ScraperJuridico.Api/Dockerfile
    container_name: scraper_api
    ports:
      - "5189:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Host=db;Database=ScraperJuridicoDb;Username=postgres;Password=password123
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: scraper_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  pgdata: